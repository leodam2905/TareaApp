# ⚠️ DOES NOT RUN THE SCHEMA-DRIFT GATE.
#
# This builds a Docker image and deploys it straight to Cloud Run. It does not
# check whether the Prisma schema the image carries matches the live database.
# That check lives in scripts/deploy-web.sh, and it is not decoration: a deploy
# that ships columns the database lacks 500s every endpoint reading that model
# the moment it starts, and skipping it once cost roughly fifteen hours of
# downtime. The gate caught a wrong-order deploy again on 2026-09-13.
#
# It used to fire on every push to main, which meant a merge deployed
# production with no gate and nobody deciding to. The trigger is now manual so
# that cannot happen by accident.
#
# THE ROUTINE PATH IS:
#
#     bash scripts/deploy-web.sh --yes
#
# Use this workflow only when that is impossible, and only knowing the schema
# has already been verified against production.
#
# To make CI deploys safe, this should call scripts/deploy-web.sh rather than
# rebuild its steps -- two copies of the gate would drift. That needs the CI
# service account to read the DATABASE_URL secret and cloud-sql-proxy on the
# runner; neither is set up today.
name: Deploy to Cloud Run (manual, UNGATED)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Warn that this path is ungated
        run: |
          echo "::warning::This workflow does NOT run the schema-drift gate."
          echo "::warning::The routine path is: bash scripts/deploy-web.sh --yes"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277743379820/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@splendid-drake-497611-h6.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t us-central1-docker.pkg.dev/splendid-drake-497611-h6/cloud-run-source-deploy/tarea-web:${{ github.sha }} \
            apps/web

      - name: Push Docker image
        run: |
          docker push us-central1-docker.pkg.dev/splendid-drake-497611-h6/cloud-run-source-deploy/tarea-web:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tarea-web \
            --image us-central1-docker.pkg.dev/splendid-drake-497611-h6/cloud-run-source-deploy/tarea-web:${{ github.sha }} \
            --region us-central1 \
            --project splendid-drake-497611-h6 \
            --allow-unauthenticated \
            --quiet
