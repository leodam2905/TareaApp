name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277743379820/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@splendid-drake-497611-h6.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t us-central1-docker.pkg.dev/splendid-drake-497611-h6/cloud-run-source-deploy/tarea-web:${{ github.sha }} \
            apps/web

      - name: Push Docker image
        run: |
          docker push us-central1-docker.pkg.dev/splendid-drake-497611-h6/cloud-run-source-deploy/tarea-web:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tarea-web \
            --image us-central1-docker.pkg.dev/splendid-drake-497611-h6/cloud-run-source-deploy/tarea-web:${{ github.sha }} \
            --region us-central1 \
            --project splendid-drake-497611-h6 \
            --quiet
