# Customer (Tarea Home) splash — white logo on the icon's dark charcoal, to
# match the Home app icon (white house on dark). Android-only here; iOS is the
# single shared Runner handled by the base config + swap script.
flutter_native_splash:
  color: "#FBFAF9"
  color_dark: "#FBFAF9"
  image: assets/images/splash-home-white-logo.png
  image_dark: assets/images/splash-home-white-logo.png

  # Android 12+ clips to a circle — use the app-icon art (white house on dark).
  android_12:
    image: assets/images/adaptive-icon-home.png
    image_dark: assets/images/adaptive-icon-home.png
    icon_background_color: "#263238"
    icon_background_color_dark: "#263238"

  android: true
  ios: false
  web: false
