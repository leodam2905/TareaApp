<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  .wrap{width:1024px;height:500px;position:relative;
    background:radial-gradient(120% 140% at 78% 30%, #1e293b 0%, #0f172a 55%, #0b1120 100%);
    font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#fff;}
  .glow{position:absolute;right:-120px;top:-120px;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle, rgba(56,189,248,.35) 0%, rgba(56,189,248,0) 70%);}
  .content{position:absolute;left:72px;top:50%;transform:translateY(-50%);max-width:620px}
  .brandrow{display:flex;align-items:baseline;gap:18px}
  .word{font-size:120px;font-weight:800;letter-spacing:-4px;line-height:1}
  .word .dot{color:#38bdf8}
  .pro{font-size:34px;font-weight:800;letter-spacing:2px;color:#0f172a;
    background:#38bdf8;padding:6px 16px;border-radius:12px}
  .tag{margin-top:22px;font-size:36px;font-weight:600;color:#e2e8f0;line-height:1.2}
  .sub{margin-top:18px;font-size:22px;font-weight:500;color:#38bdf8;letter-spacing:.5px}
  .chips{margin-top:26px;display:flex;gap:12px}
  .chip{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.4);
    color:#bae6fd;font-size:18px;font-weight:600;padding:8px 16px;border-radius:999px}
  .wrench{position:absolute;right:60px;top:50%;transform:translateY(-50%) rotate(-15deg);opacity:.9}
</style></head><body>
<div class="wrap">
  <div class="glow"></div>
  <svg class="wrench" width="300" height="300" viewBox="0 0 24 24" fill="none">
    <path d="M14.7 6.3a4 4 0 0 0-5.4 5l-6 6a1.5 1.5 0 1 0 2.1 2.1l6-6a4 4 0 0 0 5-5.4l-2.3 2.3-2.1-.6-.6-2.1 2.3-2.3z"
      stroke="#38bdf8" stroke-width="1.4" fill="rgba(56,189,248,0.18)" stroke-linejoin="round"/>
  </svg>
  <div class="content">
    <div class="brandrow"><div class="word">tarea<span class="dot">.</span></div><div class="pro">PRO</div></div>
    <div class="tag">Find jobs. Get paid.<br>Grow your business.</div>
    <div class="sub">For verified handymen &amp; service pros</div>
    <div class="chips"><div class="chip">💼 Local jobs</div><div class="chip">💸 Fast payouts</div><div class="chip">📈 Build your rep</div></div>
  </div>
</div></body></html>
