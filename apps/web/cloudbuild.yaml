substitutions:
  _PROJECT: splendid-drake-497611-h6
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/splendid-drake-497611-h6/cloud-run-source-deploy/tarea-web
  _SERVICE: tarea-web

steps:
  # Authenticate Docker with Artifact Registry
  - name: gcr.io/cloud-builders/gcloud
    args:
      - auth
      - configure-docker
      - us-central1-docker.pkg.dev

  # Pull cached layers to seed the build cache (|| true = no-fail on first run)
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker pull $_IMAGE:deps || true
        docker pull $_IMAGE:latest || true

  # Build deps stage separately so npm install layer is reused across builds
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=deps
      - --cache-from=$_IMAGE:deps
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - -t=$_IMAGE:deps
      - .
    env:
      - DOCKER_BUILDKIT=1

  # Full build reusing the cached deps and latest layers
  # Uses a bash step so we can set a SHA tag that works for both manual and triggered builds
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        SHA=$${COMMIT_SHA:-$(git rev-parse --short HEAD)}
        docker build \
          --cache-from=$_IMAGE:deps \
          --cache-from=$_IMAGE:latest \
          --build-arg=BUILDKIT_INLINE_CACHE=1 \
          -t $_IMAGE:latest \
          -t $_IMAGE:$$SHA \
          .
        docker push --all-tags $_IMAGE
    env:
      - DOCKER_BUILDKIT=1

  # Deploy to Cloud Run — always include all secrets to prevent wipe
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE:latest
      - --region=$_REGION
      - --project=$_PROJECT
      - --platform=managed
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,CLOUDINARY_API_KEY=CLOUDINARY_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,CLOUDINARY_CLOUD_NAME=CLOUDINARY_CLOUD_NAME:latest,TELNYX_API_KEY=TELNYX_API_KEY:latest,TELNYX_PHONE_NUMBER=TELNYX_PHONE_NUMBER:latest,TELNYX_MESSAGING_PROFILE_ID=TELNYX_MESSAGING_PROFILE_ID:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,CRON_SECRET=CRON_SECRET:latest
      - --quiet

images:
  - $_IMAGE:deps
  - $_IMAGE:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
