substitutions:
  _PROJECT: splendid-drake-497611-h6
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/splendid-drake-497611-h6/cloud-run-source-deploy/tarea-web
  _SERVICE: tarea-web

steps:
  # Authenticate Docker with Artifact Registry
  - name: gcr.io/cloud-builders/gcloud
    args:
      - auth
      - configure-docker
      - us-central1-docker.pkg.dev

  # Build + push with Kaniko — no Docker daemon, content-aware caching, always
  # reflects current source (fixes the stale-image bug the docker builder had).
  - name: gcr.io/kaniko-project/executor:latest
    args:
      - --destination=$_IMAGE:latest
      - --cache=true
      - --cache-ttl=168h

  # Deploy to Cloud Run — always include all secrets to prevent wipe
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_IMAGE:latest
      - --region=$_REGION
      - --project=$_PROJECT
      - --platform=managed
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,TELNYX_API_KEY=TELNYX_API_KEY:latest,TELNYX_PHONE_NUMBER=TELNYX_PHONE_NUMBER:latest,TELNYX_MESSAGING_PROFILE_ID=TELNYX_MESSAGING_PROFILE_ID:latest,TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest,TWILIO_API_KEY_SID=TWILIO_API_KEY_SID:latest,TWILIO_API_KEY_SECRET=TWILIO_API_KEY_SECRET:latest,TWILIO_PHONE_NUMBER=TWILIO_PHONE_NUMBER:latest,TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,R2_BUCKET=R2_BUCKET:latest,R2_PUBLIC_URL=R2_PUBLIC_URL:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,CRON_SECRET=CRON_SECRET:latest
      - --quiet

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
