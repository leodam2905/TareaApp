  <text x="217" y="98" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="system-ui,sans-serif">M</text>
  <text x="244" y="98" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="system-ui,sans-serif">T</text>
  <text x="271" y="98" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="system-ui,sans-serif">W</text>
  <text x="298" y="98" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="system-ui,sans-serif">T</text>
  <text x="325" y="98" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="system-ui,sans-serif">F</text>
  <text x="350" y="98" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="system-ui,sans-serif">S</text>
  <line x1="176" y1="104" x2="348" y2="104" stroke="#E2E8F0" stroke-width="1"/>

  <!-- week 1 -->
  <text x="190" y="125" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">1</text>
  <text x="217" y="125" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">2</text>
  <circle cx="244" cy="121" r="11" fill="#FB923C"/>
  <text x="244" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="system-ui,sans-serif">3</text>
  <text x="271" y="125" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">4</text>
  <text x="298" y="125" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">5</text>
  <text x="325" y="125" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">6</text>
  <text x="350" y="125" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">7</text>

