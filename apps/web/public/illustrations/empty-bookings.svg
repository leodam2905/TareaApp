  <circle cx="217" cy="145" r="11" fill="#FDBA74"/>
  <text x="217" y="149" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="system-ui,sans-serif">9</text>
  <text x="244" y="149" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">10</text>
  <text x="271" y="149" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">11</text>
  <circle cx="298" cy="145" r="11" fill="#FB923C"/>
