  <text x="190" y="197" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">22</text>
  <text x="217" y="197" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">23</text>
  <text x="244" y="197" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">24</text>
  <circle cx="271" cy="193" r="11" fill="#FDBA74"/>
  <text x="271" y="197" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="system-ui,sans-serif">25</text>
  <text x="298" y="197" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">26</text>
  <text x="325" y="197" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">27</text>
  <text x="350" y="197" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">28</text>

