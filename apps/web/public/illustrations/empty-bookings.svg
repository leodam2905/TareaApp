  <text x="217" y="173" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">16</text>
  <text x="244" y="173" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">17</text>
  <text x="271" y="173" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">18</text>
  <text x="298" y="173" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">19</text>
  <text x="325" y="173" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">20</text>
  <text x="350" y="173" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">21</text>

