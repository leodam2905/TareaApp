  <text x="244" y="221" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">31</text>

  <!-- ══════════ PERSON (sitting, lower-left) ══════════ -->

  <!-- left leg — extended forward -->
  <path d="M74 295 C56 300 40 298 26 295" stroke="#FB923C" stroke-width="20" stroke-linecap="round" fill="none"/>
  <ellipse cx="22" cy="296" rx="17" ry="8" fill="#1E293B" transform="rotate(-5 22 296)"/>

  <!-- right leg — tucked back -->
  <path d="M106 293 C116 310 120 320 122 330" stroke="#FB923C" stroke-width="20" stroke-linecap="round" fill="none"/>
  <ellipse cx="122" cy="332" rx="15" ry="7" fill="#1E293B"/>

  <!-- torso -->
  <ellipse cx="90" cy="268" rx="36" ry="30" fill="#FB923C"/>

  <!-- left arm — resting on ground -->
  <path d="M56 274 C44 282 38 290 34 298" stroke="#FB923C" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- right arm — raised toward calendar, holding pencil -->
  <path d="M122 260 C142 238 158 212 168 190" stroke="#FB923C" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- pencil -->
  <g transform="rotate(15 164 174)">
    <rect x="160" y="154" width="8" height="32" rx="3" fill="#F59E0B"/>
    <polygon points="160,154 168,154 164,144" fill="#374151"/>
    <rect x="160" y="182" width="8" height="6" rx="1" fill="#FCA5A5"/>
  </g>
  <!-- hand holding pencil -->
  <circle cx="169" cy="187" r="6" fill="#FDDCB5"/>

  <!-- neck -->
  <rect x="83" y="234" width="14" height="14" rx="5" fill="#FDDCB5"/>

  <!-- head -->
  <circle cx="90" cy="222" r="26" fill="#FDDCB5"/>

  <!-- hair -->
  <path d="M64 220 C64 196 76 190 90 190 C104 190 116 196 116 220 C110 210 104 206 90 206 C76 206 70 210 64 220 Z" fill="#1E293B"/>

  <!-- eyes (looking slightly right toward calendar) -->
  <circle cx="84" cy="222" r="3.5" fill="#1E293B"/>
  <circle cx="98" cy="222" r="3.5" fill="#1E293B"/>
  <circle cx="85.4" cy="220.6" r="1.3" fill="white"/>
  <circle cx="99.4" cy="220.6" r="1.3" fill="white"/>

  <!-- eyebrows -->
  <path d="M80 215 Q84 212 88 215" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M93 215 Q97 212 101 215" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- smile -->
  <path d="M83 230 Q90 236 97 230" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- cheek blush -->
  <circle cx="78" cy="228" r="5" fill="#FCA5A5" opacity="0.45"/>
  <circle cx="102" cy="228" r="5" fill="#FCA5A5" opacity="0.45"/>

  <!-- ══════════ BIRDS (lower right) ══════════ -->
  <path d="M294 309 Q300 302 306 309" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M312 299 Q319 291 326 299" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M280 321 Q285 315 290 321" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- ══════════ SPARKLES ══════════ -->
  <circle cx="148" cy="28" r="4" fill="#FB923C" opacity="0.45"/>
  <circle cx="362" cy="90" r="3.5" fill="#FDBA74" opacity="0.5"/>
  <circle cx="24" cy="152" r="3" fill="#FB923C" opacity="0.4"/>
  <circle cx="148" cy="286" r="4.5" fill="#FDBA74" opacity="0.38"/>

  <!-- 8-point star sparkle (top-left) -->
  <g transform="translate(42 74)" opacity="0.5">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#FDBA74" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#FDBA74" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5.5" y1="-5.5" x2="5.5" y2="5.5" stroke="#FDBA74" stroke-width="1" stroke-linecap="round"/>
    <line x1="5.5" y1="-5.5" x2="-5.5" y2="5.5" stroke="#FDBA74" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- plus sparkle (right) -->
  <g transform="translate(368 170)" opacity="0.45">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round"/>
  </g>

</svg>
