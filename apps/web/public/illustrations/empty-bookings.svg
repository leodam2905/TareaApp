  <text x="325" y="149" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">13</text>
  <text x="350" y="149" text-anchor="middle" fill="#CBD5E1" font-size="11" font-family="system-ui,sans-serif">14</text>

